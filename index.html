<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica 02</title>
</head>
<body>
    <main>
        <form>
            <h1>Calculadora Basica</h1>
            <input type="number" placeholder="Digite o 1° numero">
            <input type="number" placeholder="Digite o 2° numero">
            <button type="button">+</button>
            <button type="button">-</button>
            <button type="button">*</button>
            <button type="button">/</button>
        </form>
    </main>
</body>
</html>
